<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #121212;
      --line: #2f2f2f;
      --text: #f5f5f5;
      --muted: #b8b8b8;
      --err: #ff7b72;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at 20% 0%, #1c1c1c 0%, var(--bg) 40%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      padding: 18px;
    }
    .title {
      margin: 0 0 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
    }
    .logo { width: 24px; height: 24px; border: 1px solid #444; border-radius: 6px; }
    .sub { margin: 0 0 14px; color: var(--muted); font-size: 0.9rem; }
    .field { margin-bottom: 10px; }
    input {
      width: 100%;
      background: #101010;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      outline: none;
    }
    button {
      width: 100%;
      border: 1px solid #fff;
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      color: #000;
      font-weight: 700;
      cursor: pointer;
    }
    .error {
      display: none;
      margin-bottom: 10px;
      border: 1px solid #5a2a2a;
      border-radius: 8px;
      padding: 9px;
      background: #221414;
      color: #f0bbbb;
      font-size: 0.88rem;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title"><img class="logo" src="/static/logo.svg" alt="" />Admin Login</h1>
    <p class="sub">Sign in to access analytics dashboard.</p>
    <div id="errorBox" class="error{% if error %} show{% endif %}">{{ error or '' }}</div>
    <form id="loginForm" method="post" action="/admin/login">
      <div class="field"><input id="username" name="username" type="text" placeholder="Username" required /></div>
      <div class="field"><input id="password" name="password" type="password" placeholder="Password" required /></div>
      <button id="loginBtn" type="submit">Login</button>
    </form>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const loginBtn = document.getElementById('loginBtn');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('show');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.classList.remove('show');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const payload = {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        };
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Login failed');
        }
        window.location.href = '/admin';
      } catch (err) {
        showError(err.message || 'Login failed');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
